name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
  build-and-release:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build APK on EAS
        run: eas build -p android --profile preview --non-interactive --wait --json > build.json
      - name: Download APK
        run: curl -fsSL -o "vitrina-${GITHUB_REF_NAME}.apk" "$(jq -r '.[0].artifacts.buildUrl' build.json)"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "vitrina-${GITHUB_REF_NAME}.apk" --title "Vitrina $GITHUB_REF_NAME" --generate-notes
